<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lab Subnet Monitor{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>

<body>
    <div class="container">
        <header>
            <h2>{% block page_title %}Lab Subnet Monitor{% endblock %}</h2>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>

    <script>
        document.querySelectorAll('time.utc-time').forEach(el => {
            const rawIso = el.getAttribute('datetime') || el.textContent.trim();
            const date = new Date(rawIso);
            if (isNaN(date.getTime())) return;
            el.title = date.toISOString();
            el.textContent = new Intl.DateTimeFormat(undefined, {
                dateStyle: 'medium',
                timeStyle: 'short'
            }).format(date);
        });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
